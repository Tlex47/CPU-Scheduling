<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPU Scheduling</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <h1>CPU Scheduling</h1>
      </header>

      <main class="panel">
        <h2>Input Data</h2>
        <form id="inputForm">
          <div class="input-section">
            <div class="field">
              <label for="processCount">Processes</label>
              <input id="processCount" type="number" min="1" placeholder="ระบุจำนวน processes" />
            </div>

            <div class="field">
              <label for="timeQuantum">Time Quantum</label>
              <input id="timeQuantum" type="number" min="1" value="2" placeholder="ระบุ time quantum" />
            </div>
          </div>

          <div class="button-group">
            <button class="primary-btn" id="createTableBtn" type="button">Create</button>
            <button class="secondary-btn" id="randomizeBtn" type="button">Random BT</button>
            <button class="primary-btn" id="calculateBtn" type="submit">Calculate</button>
          </div>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Process</th>
                  <th>Burst Time</th>
                </tr>
              </thead>
              <tbody id="btTableBody"></tbody>
            </table>
          </div>
        </form>
      </main>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
